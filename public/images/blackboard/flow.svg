<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 220" font-family="Inter, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="870" height="220" rx="12" fill="#0f172a" stroke="#1e293b" />

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="194" y1="130" x2="236" y2="130" />
    <line x1="414" y1="130" x2="456" y2="130" />
    <line x1="634" y1="130" x2="676" y2="130" />
  </g>

  <!-- Arrow labels -->
  <g font-size="11" fill="#94a3b8" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">
    <text x="215" y="76">load / save</text>
    <text x="435" y="76">live updates</text>
    <text x="655" y="76">atomic copy</text>
  </g>

  <!-- 1. Anchor objects -->
  <rect x="20" y="90" width="170" height="80" rx="10" fill="#082f49" stroke="#22d3ee" stroke-width="2" />
  <text x="105" y="122" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Anchor objects</text>
  <text x="105" y="146" font-size="12" fill="#94a3b8" text-anchor="middle">create / destroy</text>

  <!-- 2. Blackboard -->
  <rect x="240" y="90" width="170" height="80" rx="10" fill="#4a044e" stroke="#e879f9" stroke-width="2" />
  <text x="325" y="122" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Blackboard</text>
  <text x="325" y="146" font-size="12" fill="#94a3b8" text-anchor="middle">dictionary of entities</text>

  <!-- 3. Game session -->
  <rect x="460" y="90" width="170" height="80" rx="10" fill="#451a03" stroke="#fcd34d" stroke-width="2" />
  <text x="545" y="122" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Game session</text>
  <text x="545" y="146" font-size="12" fill="#94a3b8" text-anchor="middle">folder of JSON files</text>

  <!-- 4. Save archive -->
  <rect x="680" y="90" width="170" height="80" rx="10" fill="#022c22" stroke="#34d399" stroke-width="2" />
  <text x="765" y="122" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Save archive</text>
  <text x="765" y="146" font-size="12" fill="#94a3b8" text-anchor="middle">save game</text>
</svg>
