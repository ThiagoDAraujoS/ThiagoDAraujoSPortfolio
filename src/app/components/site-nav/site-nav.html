<div class="nav">
  <a class="nav__brand" href="#about">
    <span class="nav__name">{{ site.name }}</span>
    <span class="nav__tagline">{{ site.tagline }}</span>
  </a>

  <nav class="nav__links">
    @for (link of links; track link.href; let i = $index) {
      <a [href]="link.href"><span>0{{ i + 1 }}.</span> {{ link.label }}</a>
    }
  </nav>
</div>
